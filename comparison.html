<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topo Pattern Comparison</title>
  <style>
    body {
      margin: 0;
      background: #161718;
      font-family: sans-serif;
      color: #F5F0E6;
      padding: 40px 20px;
    }
    .comparison {
      display: flex;
      gap: 40px;
      max-width: 3400px;
      margin: 0 auto;
      align-items: flex-start;
    }
    .panel {
      flex: 1;
      min-width: 0;
    }
    .panel h2 {
      margin: 0 0 20px 0;
      font-size: 18px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.7;
    }
    .image-container {
      width: 1600px;
      height: 1000px;
      background: #161718;
      position: relative;
      border: 1px solid rgba(245, 240, 230, 0.1);
    }
    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    .reference {
      filter: invert(1);
    }
  </style>
</head>
<body>
  <div class="comparison">
    <div class="panel">
      <h2>Reference (Inverted)</h2>
      <div class="image-container">
        <img src="/workspace/unearth-self/topo-reference.png" alt="Reference" class="reference">
      </div>
    </div>
    <div class="panel">
      <h2>Generated</h2>
      <div class="image-container">
        <img src="/workspace/public/topo.svg" alt="Generated">
      </div>
    </div>
  </div>
</body>
</html>
